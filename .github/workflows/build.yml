name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-Intel
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            cmake \
            clang \
            pkg-config \
            nasm \
            libde265-dev \
            libx265-dev \
            libaom-dev \
            libnuma-dev \
            libsharpyuv-dev

      - name: Setup vcpkg
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install libheif (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: C:\vcpkg\vcpkg.exe install libheif:x64-windows-static-md

      - name: Resolve libheif for Linux builds
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: src-tauri
        run: cargo update -p libheif-rs -p libheif-sys

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCPKG_ROOT: ${{ matrix.platform == 'windows-latest' && 'C:\vcpkg' || '' }}
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.platform == 'windows-latest' && 'x64-windows-static-md' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SnapShift ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform below.

            **macOS:** `.dmg` -> drag to Applications -> first launch may need right-click -> Open (unsigned build).
            **Windows:** `.msi` -> SmartScreen -> More info -> Run anyway (unsigned build).
            **Linux:** `.deb`, `.rpm`, or `.AppImage` (`chmod +x` first).

            See the [install guide](https://github.com/miroslav-gruevski/SnapShift#install) for one-line Homebrew / Scoop install.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  publish-update-manifest:
    name: Publish updater manifest
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x scripts/generate-latest-json.sh
          scripts/generate-latest-json.sh "$TAG" "${{ github.repository }}"
          gh release upload "$TAG" latest.json -R "${{ github.repository }}" --clobber

  bump-homebrew:
    name: Bump Homebrew tap
    needs: publish-update-manifest
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PACKAGE_MANAGERS == 'true'
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: miroslav-gruevski/homebrew-snapshift
          token: ${{ secrets.PACKAGE_MANAGER_TOKEN }}
          path: tap

      - name: Update cask
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          arm_dmg=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' | grep 'aarch64\.dmg$' | head -n1)
          x64_dmg=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' | grep '_x64\.dmg$' | head -n1)
          arm_url="https://github.com/${REPO}/releases/download/${TAG}/${arm_dmg}"
          x64_url="https://github.com/${REPO}/releases/download/${TAG}/${x64_dmg}"
          arm_sha=$(curl -sL "$arm_url" | shasum -a 256 | awk '{print $1}')
          x64_sha=$(curl -sL "$x64_url" | shasum -a 256 | awk '{print $1}')

          mkdir -p tap/Casks
          cat > tap/Casks/snapshift.rb <<RUBY
          cask "snapshift" do
            version "${version}"

            on_arm do
              url "https://github.com/${REPO}/releases/download/${TAG}/${arm_dmg}",
                  verified: "github.com/${REPO}/"
              sha256 "${arm_sha}"
            end

            on_intel do
              url "https://github.com/${REPO}/releases/download/${TAG}/${x64_dmg}",
                  verified: "github.com/${REPO}/"
              sha256 "${x64_sha}"
            end

            name "SnapShift"
            desc "Tray-based batch image converter"
            homepage "https://github.com/${REPO}"

            app "SnapShift.app"

            caveats <<~EOS
              SnapShift is not notarized. On first launch, right-click SnapShift in Applications and choose Open.
            EOS

            zap trash: [
              "~/Library/Application Support/com.miro.snapshift",
              "~/Library/Caches/com.miro.snapshift",
              "~/Library/Preferences/com.miro.snapshift.plist",
            ]
          end
          RUBY

      - name: Commit and push tap
        working-directory: tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/snapshift.rb
          git diff --cached --quiet || git commit -m "snapshift ${TAG}"
          git push

  bump-scoop:
    name: Bump Scoop bucket
    needs: publish-update-manifest
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PACKAGE_MANAGERS == 'true'
    steps:
      - name: Checkout bucket
        uses: actions/checkout@v4
        with:
          repository: miroslav-gruevski/scoop-snapshift
          token: ${{ secrets.PACKAGE_MANAGER_TOKEN }}
          path: bucket

      - name: Update manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          msi=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' | grep '_x64_en-US\.msi$' | head -n1)
          msi_url="https://github.com/${REPO}/releases/download/${TAG}/${msi}"
          msi_sha=$(curl -sL "$msi_url" | sha256sum | awk '{print $1}')

          mkdir -p bucket/bucket
          cat > bucket/bucket/snapshift.json <<JSON
          {
            "version": "${version}",
            "description": "Tray-based batch image converter",
            "homepage": "https://github.com/${REPO}",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "${msi_url}",
                "hash": "${msi_sha}"
              }
            },
            "shortcuts": [
              ["SnapShift.exe", "SnapShift"]
            ],
            "checkver": {
              "github": "https://github.com/${REPO}"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/${REPO}/releases/download/v\$version/SnapShift_\$version_x64_en-US.msi"
                }
              }
            }
          }
          JSON

      - name: Commit and push bucket
        working-directory: bucket
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/snapshift.json
          git diff --cached --quiet || git commit -m "snapshift ${TAG}"
          git push
